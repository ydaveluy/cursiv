name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  CTEST_PARALLEL_LEVEL: "4"

jobs:
  gcc:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    container: gcc:16
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc-debug, gcc-release]
        include:
          # Keep generated tables within the GCC Debug runner's memory.
          - preset: gcc-debug
            jobs: 2
            debug-info: -g1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tools
        run: apt-get update && apt-get install -y --no-install-recommends ccache cmake git ninja-build
      - name: cache compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-ubuntu26-gcc16-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-v1-ubuntu26-gcc16-${{ matrix.preset }}-
      - name: configure
        # Keep shared DWARF separate and compressed across the many binaries.
        run: >-
          cmake --preset ${{ matrix.preset }} -DCURSIV_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS_DEBUG="${{ matrix.debug-info || '-g' }} -gsplit-dwarf -gz=zlib"
      - name: build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.jobs || env.CMAKE_BUILD_PARALLEL_LEVEL }}
        run: |
          sed -n '1,5p' /proc/meminfo
          df -h .
          ccache --zero-stats
          cmake --build --preset ${{ matrix.preset }}
      - name: test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
      - name: compilation cache statistics
        if: always()
        run: ccache --show-stats

  clang:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    strategy:
      fail-fast: false
      matrix:
        preset: [clang-debug, clang-release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ccache
      - name: cache compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-ubuntu26-clang22-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-v1-ubuntu26-clang22-${{ matrix.preset }}-
      - name: configure
        run: >-
          cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=clang++-22
          -DCURSIV_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS_DEBUG="-g -gsplit-dwarf -gz=zlib"
      - name: build
        run: |
          sed -n '1,5p' /proc/meminfo
          df -h .
          ccache --zero-stats
          cmake --build --preset ${{ matrix.preset }}
      - name: test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
      - name: compilation cache statistics
        if: always()
        run: ccache --show-stats

  # One module runs on every host, but the runner maps its files differently on
  # each: a whole session on the module the Linux job built, whose workspace scan
  # reads the disk through file URIs.
  wasi-hosts:
    needs: wasi
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasi-language-server
          path: wasi-module
      - name: session
        run: >-
          node tools/lsp-session.mjs wasi-module/domainmodel_lsp
          examples/domainmodel/example/blog.dmodel
          --folder examples/domainmodel/example

  # MinGW-w64 GCC from MSYS2, the GCC of the gcc job on Windows: generated
  # parsers use computed goto and guaranteed tail calls, which MSVC lacks.
  windows:
    runs-on: windows-2025
    timeout-minutes: 240
    defaults:
      run:
        shell: msys2 {0}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc-debug, gcc-release]
        include:
          # Keep generated tables within the GCC Debug runner's memory.
          - preset: gcc-debug
            jobs: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
      - name: cache compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-windows2025-ucrt64-gcc16-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-v1-windows2025-ucrt64-gcc16-${{ matrix.preset }}-
      - name: configure
        # Debug runs for its assertions: debug info would fill the runner's disk.
        run: >-
          cmake --preset ${{ matrix.preset }} -DCURSIV_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS_DEBUG=-g0
      - name: build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.jobs || env.CMAKE_BUILD_PARALLEL_LEVEL }}
        run: |
          df -h .
          ccache --zero-stats
          cmake --build --preset ${{ matrix.preset }}
      - name: test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
      - name: compilation cache statistics
        if: always()
        run: ccache --show-stats
      # The host is detected and its archive unpacks, whatever the build did.
      - name: fetch wasi-sdk
        if: ${{ !cancelled() && matrix.preset == 'gcc-release' }}
        run: cmake -P tools/fetch-wasi-sdk.cmake

  # Apple Clang from the runner's default Xcode: std::jthread needs the libc++
  # of Xcode 26.4 or later.
  macos:
    runs-on: macos-26
    timeout-minutes: 240
    env:
      # This runner has 3 cores and 7 GB.
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      CTEST_PARALLEL_LEVEL: "3"
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    strategy:
      fail-fast: false
      matrix:
        preset: [clang-debug, clang-release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tools
        run: |
          brew install ccache
          clang++ --version
      - name: cache compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-macos26-appleclang-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-v1-macos26-appleclang-${{ matrix.preset }}-
      - name: configure
        # Debug runs for its assertions: debug info would fill the runner's disk.
        run: >-
          cmake --preset ${{ matrix.preset }} -DCURSIV_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS_DEBUG=-g0
      - name: build
        run: |
          df -h .
          ccache --zero-stats
          cmake --build --preset ${{ matrix.preset }}
      - name: test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
      - name: compilation cache statistics
        if: always()
        run: ccache --show-stats
      # The host is detected and its archive unpacks, whatever the build did.
      - name: fetch wasi-sdk
        if: ${{ !cancelled() && matrix.preset == 'clang-release' }}
        run: cmake -P tools/fetch-wasi-sdk.cmake

  wasi:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    # CMake's native generator sub-builds use the supported host compiler.
    env:
      CC: clang-22
      CXX: clang++-22
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    strategy:
      fail-fast: false
      matrix:
        preset: [wasi-debug, wasi-release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # V8 in Node 24 exhausts memory optimizing large Unicode lexers.
          node-version: 26
      - name: Install compilation cache
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ccache
      - name: cache compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-ubuntu26-wasi-sdk34-hostclang22-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-v1-ubuntu26-wasi-sdk34-hostclang22-${{ matrix.preset }}-
      - name: cache wasi-sdk
        id: sdk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/wasi-sdk-34.0
          key: wasi-sdk-34.0-x86_64-linux
      - name: fetch wasi-sdk (pinned, checksummed)
        if: steps.sdk.outputs.cache-hit != 'true'
        run: cmake -P tools/fetch-wasi-sdk.cmake
      - name: Install Binaryen
        if: matrix.preset == 'wasi-release'
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
      - name: configure
        run: cmake --preset ${{ matrix.preset }} -DCURSIV_WARNINGS_AS_ERRORS=ON
      - name: build
        run: |
          sed -n '1,5p' /proc/meminfo
          df -h .
          ccache --zero-stats
          cmake --build --preset ${{ matrix.preset }}
      - name: test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
      - name: compilation cache statistics
        if: always()
        run: ccache --show-stats
      - name: keep the module for the other hosts
        if: matrix.preset == 'wasi-release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasi-language-server
          path: build-wasi/examples/domainmodel/src/domainmodel_lsp
          retention-days: 1
      - name: package extensions
        if: matrix.preset == 'wasi-release'
        run: |
          wasm-opt --version
          tools/package-vsix.sh build-wasi dist-vsix
      - name: upload extensions
        if: matrix.preset == 'wasi-release' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-extensions
          path: dist-vsix/
          if-no-files-found: error
      # The example language servers, for the online demo of the docs job.
      - name: collect language servers
        if: matrix.preset == 'wasi-release' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: tools/wasm-dist.sh build-wasi dist
      - name: upload language servers
        if: matrix.preset == 'wasi-release' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: language-servers
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The documentation site deployed from main, with the "Try it online" page
  # running the language servers built above. docs.yml checks the
  # documentation on every push and pull request.
  docs:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: wasi
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: language-servers
          path: language-servers
      - run: python -m pip install -r requirements-docs.txt
      - run: mkdocs build --strict
      - run: tools/build-demo.sh language-servers site/demo
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy-docs:
    needs: docs
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # A main commit whose builds pass is then checked against the language
  # library: cursiv-grammar runs its CI on this exact commit.
  notify-grammars:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gcc, clang, wasi]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: dispatch to cursiv-grammar
        env:
          GH_TOKEN: ${{ secrets.GRAMMARS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::GRAMMARS_DISPATCH_TOKEN is not set: cursiv-grammar is not notified."
            exit 0
          fi
          gh api repos/ydaveluy/cursiv-grammar/dispatches \
            -f event_type=cursiv-engine-updated \
            -f "client_payload[engine_ref]=$GITHUB_SHA"
