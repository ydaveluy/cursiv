name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  CTEST_PARALLEL_LEVEL: "4"

jobs:
  gcc:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    container: gcc:16
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc-debug, gcc-release]
        include:
          # Keep generated tables within the GCC Debug runner's memory.
          - preset: gcc-debug
            jobs: 2
            debug-info: -g1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tools
        run: apt-get update && apt-get install -y --no-install-recommends ccache cmake git ninja-build
      - name: cache compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-ubuntu26-gcc16-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-v1-ubuntu26-gcc16-${{ matrix.preset }}-
      - name: configure
        # Keep shared DWARF separate and compressed across the many binaries.
        run: >-
          cmake --preset ${{ matrix.preset }} -DCURSIV_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS_DEBUG="${{ matrix.debug-info || '-g' }} -gsplit-dwarf -gz=zlib"
      - name: build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.jobs || env.CMAKE_BUILD_PARALLEL_LEVEL }}
        run: |
          sed -n '1,5p' /proc/meminfo
          df -h .
          ccache --zero-stats
          cmake --build --preset ${{ matrix.preset }}
      - name: test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
      - name: compilation cache statistics
        if: always()
        run: ccache --show-stats

  clang:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    strategy:
      fail-fast: false
      matrix:
        preset: [clang-debug, clang-release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ccache
      - name: cache compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-ubuntu26-clang22-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-v1-ubuntu26-clang22-${{ matrix.preset }}-
      - name: configure
        run: >-
          cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=clang++-22
          -DCURSIV_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS_DEBUG="-g -gsplit-dwarf -gz=zlib"
      - name: build
        run: |
          sed -n '1,5p' /proc/meminfo
          df -h .
          ccache --zero-stats
          cmake --build --preset ${{ matrix.preset }}
      - name: test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
      - name: compilation cache statistics
        if: always()
        run: ccache --show-stats

  wasi:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    # CMake's native generator sub-builds use the supported host compiler.
    env:
      CC: clang-22
      CXX: clang++-22
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    strategy:
      fail-fast: false
      matrix:
        preset: [wasi-debug, wasi-release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # V8 in Node 24 exhausts memory optimizing large Unicode lexers.
          node-version: 26
      - name: Install compilation cache
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ccache
      - name: cache compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-ubuntu26-wasi-sdk34-hostclang22-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-v1-ubuntu26-wasi-sdk34-hostclang22-${{ matrix.preset }}-
      - name: cache wasi-sdk
        id: sdk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/wasi-sdk-34.0
          key: wasi-sdk-34.0-x86_64-linux
      - name: fetch wasi-sdk (pinned, checksummed)
        if: steps.sdk.outputs.cache-hit != 'true'
        run: tools/fetch-wasi-sdk.sh
      - name: Install Binaryen
        if: matrix.preset == 'wasi-release'
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
      - name: configure
        run: cmake --preset ${{ matrix.preset }} -DCURSIV_WARNINGS_AS_ERRORS=ON
      - name: build
        run: |
          sed -n '1,5p' /proc/meminfo
          df -h .
          ccache --zero-stats
          cmake --build --preset ${{ matrix.preset }}
      - name: test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
      - name: compilation cache statistics
        if: always()
        run: ccache --show-stats
      - name: package extensions
        if: matrix.preset == 'wasi-release'
        run: |
          wasm-opt --version
          tools/package-vsix.sh build-wasi dist-vsix
      - name: upload extensions
        if: matrix.preset == 'wasi-release' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-extensions
          path: dist-vsix/
          if-no-files-found: error
