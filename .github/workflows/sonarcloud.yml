name: SonarCloud

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  CTEST_PARALLEL_LEVEL: "4"
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_MAXSIZE: 1G
  CCACHE_COMPILERCHECK: content

defaults:
  run:
    shell: bash

jobs:
  analyze:
    runs-on: ubuntu-26.04
    container: gcc:16
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install build and coverage tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates ccache cmake curl git gnupg ninja-build python3-venv unzip
          python3 -m venv .venv-coverage
          .venv-coverage/bin/python -m pip install gcovr==8.7
      - name: Cache compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-ubuntu26-gcc16-coverage-${{ github.sha }}
          restore-keys: ccache-v1-ubuntu26-gcc16-coverage-
      - name: Configure coverage
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_FLAGS="--coverage -fprofile-update=atomic"
          -DCMAKE_EXE_LINKER_FLAGS=--coverage
          -DCMAKE_CXX_FLAGS_DEBUG="-g -gsplit-dwarf -gz=zlib"
          -DCURSIV_MIMALLOC=OFF
      - name: Build
        run: |
          sed -n '1,5p' /proc/meminfo
          df -h .
          ccache --zero-stats
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Collect coverage
        run: >-
          .venv-coverage/bin/gcovr --root . --filter src/
          --gcov-executable gcov
          --gcov-ignore-parse-errors=negative_hits.warn_once_per_file
          --exclude-throw-branches --exclude-unreachable-branches
          --exclude-branches-by-pattern='.*'
          --sonarqube build/coverage.xml build
      - name: Compilation cache statistics
        if: always()
        run: ccache --show-stats
      - name: Check SonarCloud configuration
        id: sonar
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login != 'dependabot[bot]'))
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [[ -n "$SONAR_TOKEN" && -n "$SONAR_PROJECT_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Explain skipped SonarCloud upload
        if: steps.sonar.outputs.enabled != 'true'
        run: |
          echo "::notice::Coverage checks passed; SonarCloud upload is unavailable for fork PRs, Dependabot events, or when SONAR_TOKEN / SONAR_PROJECT_KEY is missing."
          echo "SonarCloud upload skipped. Fork PRs and Dependabot events do not use repository secrets; other runs require SONAR_TOKEN and SONAR_PROJECT_KEY. Build, tests and coverage still run." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload SonarCloud analysis
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=ydaveluy
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.cfamily.compile-commands=build/compile_commands.json
            -Dsonar.coverageReportPaths=build/coverage.xml
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.cpp.file.suffixes=.cpp,.hpp
