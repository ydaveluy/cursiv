site_name: cursiv++
site_description: A high-performance C++20 toolkit for building languages — grammar, AST, validation, references, formatting and a language server, from one declaration.
site_url: https://ydaveluy.github.io/cursiv/
repo_url: https://github.com/ydaveluy/cursiv
repo_name: ydaveluy/cursiv
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true
# The demo's npm manifest is build input, not part of the published page.
exclude_docs: |
  demo/package*.json

theme:
  name: material
  language: en
  logo: assets/icon-white.png
  favicon: assets/icon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Introduction:
      - introduction/index.md
      - Mental model: introduction/mental-model.md
      - Features: introduction/features.md
      - Why cursiv: introduction/why-cursiv.md
  - Learn:
      - learn/index.md
      - Create a project: learn/scaffold.md
      - Build a language end to end: learn/walkthrough.md
      - Write a grammar: learn/write-a-grammar.md
      - Test your language: learn/testing.md
      - Read the AST from a program: learn/consume-the-ast.md
      - Ship an editor extension: learn/editor-integration.md
  - Recipes:
      - recipes/index.md
      - Qualified names and scoping: recipes/scoping.md
      - Custom validation: recipes/validation.md
      - Formatting: recipes/formatting.md
      - Case-insensitive languages: recipes/case-insensitive.md
      - Indentation-sensitive languages: recipes/indentation.md
      - Several languages in one project: recipes/multiple-languages.md
      - Reuse a grammar: recipes/reuse-a-grammar.md
      - Cross-compiling to wasm: recipes/wasm.md
  - Reference:
      - reference/index.md
      - Grammar reference: reference/grammar.md
      - AST vocabulary: reference/ast.md
      - Services: reference/services.md
      - CMake API: reference/cmake.md
      - Command line: reference/cli.md
      - Test module: reference/test.md
      - MCP server: reference/mcp.md
      - Grammar errors: reference/refusals.md
      - Glossary: reference/glossary.md
  - Examples: examples/index.md
  # Not a MkDocs page: the deployment adds it with tools/build-demo.sh.
  - Try it online: demo/index.html
  - Benchmarks: benchmarks/README.md
  - FAQ: faq.md
